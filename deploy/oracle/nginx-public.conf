# Include inside the existing HTTPS server block. Keep the simulation loopback-only.
location = /tofufu-adventure/play {
    limit_conn tofufu_public_connections 4;
    limit_req zone=tofufu_public_handshakes burst=4 nodelay;
    proxy_pass http://127.0.0.1:9080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    access_log off;
}
