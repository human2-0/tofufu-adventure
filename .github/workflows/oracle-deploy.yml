name: Deploy Oracle meadow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-meadow
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.ORACLE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: oracle
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload this commit and validate before restart
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          [[ "$ORACLE_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$ORACLE_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          git archive --format=tar.gz --output=source.tar.gz "$GITHUB_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes source.tar.gz "$ORACLE_USER@$ORACLE_HOST:/tmp/tofufu-$GITHUB_SHA.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" "sudo -n /usr/local/lib/tofufu/release.sh /tmp/tofufu-$GITHUB_SHA.tar.gz $GITHUB_SHA"
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
